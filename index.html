<script>
'use strict';
/* ============ Math + drawing helpers ============ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
/* a playful jiggle for pop-ups: a springy squash-and-stretch when they land, settling quickly,

function jiggle(t, seed) {

const E = {
  out: t => 1 - Math.pow(1 - clamp(t, 0, 1), 3),
  inOut: t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },

function rr(g, x, y, w, h, r) {

  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);

function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.abs(r), 0, TAU); }
let INK = false;
function fillP(g, c) { g.fillStyle = c; g.fill(); if (INK) { g.lineJoin = 'round'; g.strokeStyle = 'rgba(61,42,34,.85)'; g.lineWidth = 2.4; g.stroke(); } }

/* type system: Jost for UI and body (clean, geometric, salon-modern), Cormorant Garamond for display headings (editorial, high-end) */
const FONT = '"Jost", "Futura", "Avenir Next", "Helvetica Neue", system-ui, sans-serif';
const DISPLAY = '"Cormorant Garamond", "Cormorant", "Didot", "Bodoni 72", Georgia, serif';
const LUX = { ink: '#1c1517', ivory: '#faf5ee', champagne: '#c9a46a', champL: '#e6cf9f', blush: '#e9c7c2', rose: '#9e3d5a', forest: '#2e5e48', taupe: '#8a7f78' };
function text(g, s, x, y, o) {
  o = o || {};
  const sz = o.size || 28;
  g.font = (o.weight || 600) + ' ' + sz + 'px ' + FONT;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.sw || 6; g.strokeStyle = o.stroke; g.strokeText(s, x, y); }
  g.fillStyle = o.color || '#3b2f2a'; g.fillText(s, x, y);
}
function wrapLines(g, s, maxW, size, weight) {
  g.font = (weight || 500) + ' ' + size + 'px ' + FONT;
  const words = s.split(' '), lines = []; let cur = '';

  if (cur) lines.push(cur); return lines;
}
function para(g, s, x, y, maxW, o) {
  o = o || {}; const size = o.size || 24, lh = o.lh || size * 1.3;
  const ls = wrapLines(g, s, maxW, size, o.weight || 500);
  ls.forEach((l, i) => text(g, l, x, y + i * lh, Object.assign({}, o, { size, weight: o.weight || 500 })));
  return ls.length * lh;
}
function drawHeart(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 6);
  g.bezierCurveTo(-14, -4, -10, -16, 0, -9);
  g.bezierCurveTo(10, -16, 14, -4, 0, 6);

}
function drawStar(g, x, y, r, col, pts) {
  pts = pts || 5; g.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr2 = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  g.closePath(); g.fillStyle = col; g.fill();
}
function drawPaw(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  ell(g, 0, 5, 9, 7.5); g.fill();
  ell(g, -9, -5, 3.6, 4.5, -.3); g.fill(); ell(g, -3, -10, 3.6, 4.8); g.fill();
  ell(g, 4, -10, 3.6, 4.8); g.fill(); ell(g, 10, -4, 3.6, 4.5, .3); g.fill();

/* ============ Style helpers: soft shading + warm ink outlines ============ */
const OUT = '#3d2a22';
const _cc = new Map();
function shade(hex, amt) {
  const k = hex + amt; let v = _cc.get(k); if (v) return v;

}
function rad(g, x, y, r, base) {

  gr.addColorStop(0, shade(base, .28)); gr.addColorStop(.55, base); gr.addColorStop(1, shade(base, -.2)); return gr;
}
function ink(g, fill, lw) { g.fillStyle = fill; g.fill(); g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = OUT; g.lineWidth = lw || 3; g.stroke(); }
function capO(g, x1, y1, x2, y2, w, col, lw) {

  g.globalAlpha = .4; capsule(g, x1 - w * .17, y1 - w * .17, x2 - w * .17, y2 - w * .17, w * .28, shade(col, .4)); g.globalAlpha = 1;
}
function handO(g, x, y, r) { circ(g, x, y, r || 9.5); ink(g, rad(g, x, y, r || 9.5, SC.skin), 2.6); }

/* ============ Mona (silver tabby, swirl markings, green-gold eyes, purple collar) ============ */
const MC = { fur: '#ab9f90', furD: '#8b7f72', stripe: '#4a3c33', light: '#f6efe4', eye: '#d3dc4a', eyeD: '#7fa12a', nose: '#f19a9a', inner: '#f7b9b4', collar: '#8a5fd0', paw: '#f3ebe0' };

function drawMonaHead(g, x, y, s, o) {
  o = o || {};
  const t = o.t || 0, eyes = o.eyes || 'open', lx = (o.look && o.look.x) || 0, ly = (o.look && o.look.y) || 0;
  g.save(); g.translate(x, y); g.scale(s, s); if (o.tilt) g.rotate(o.tilt);
  const eu = o.earsUp ? 1.18 : 1, et = Math.sin(t * 1.3) * .04;
  for (const sd of [-1, 1]) {
    g.save(); g.scale(sd, 1); g.rotate(sd === 1 ? et : -et);
    g.beginPath(); g.moveTo(-27, -4); g.quadraticCurveTo(-31, -30 * eu, -25, -37 * eu); g.quadraticCurveTo(-14, -31 * eu, -3, -21); g.closePath(); ink(g, MC.fur);
    g.beginPath(); g.moveTo(-22, -11); g.quadraticCurveTo(-25, -27 * eu, -22, -30 * eu); g.quadraticCurveTo(-15, -26 * eu, -9, -20); g.closePath(); fillP(g, MC.inner);
    g.restore();
  }
  const out = o.outfit || 'none';
  if (out === 'scarf') {
    rr(g, -27, 14, 54, 16, 8); ink(g, '#e0473e');
    g.save(); rr(g, -27, 14, 54, 16, 8); g.clip(); for (let i = -22; i < 28; i += 12) { g.fillStyle = '#fff6ea'; g.fillRect(i, 14, 5, 16); } g.restore();
    g.save(); g.translate(14, 24); g.rotate(.25); rr(g, 0, 0, 14, 34, 6); ink(g, '#e0473e'); g.fillStyle = '#fff6ea'; g.fillRect(2, 10, 10, 5); g.fillRect(2, 22, 10, 5); g.restore();
  } else if (out === 'collar') {
    rr(g, -22, 15, 44, 10, 5); ink(g, '#e0473e', 2.4);
    circ(g, 0, 32, 9); ink(g, rad(g, 0, 32, 9, '#f2c23e'), 2.4); circ(g, -3, 29, 2.8); fillP(g, '#fff6c8'); line(g, -5, 34, 5, 34, '#9a7414', 2);
  } else { rr(g, -21, 15, 42, 8, 4); ink(g, MC.collar, 2.2); circ(g, 0, 26, 4.4); ink(g, '#f2c94e', 2); }
  // head
  ell(g, 0, 0, 30, 26); ink(g, rad(g, 0, 0, 30, MC.fur));
  g.lineCap = 'round';
  line(g, -9, -22, -6, -12, MC.stripe, 3.6); line(g, 0, -25, 0, -13, MC.stripe, 3.8); line(g, 9, -22, 6, -12, MC.stripe, 3.6);
  line(g, -29, -2, -20, 1, MC.stripe, 3); line(g, -28, 6, -20, 6, MC.stripe, 2.6); line(g, 29, -2, 20, 1, MC.stripe, 3); line(g, 28, 6, 20, 6, MC.stripe, 2.6);
  ell(g, -6.5, 10, 10, 8); fillP(g, MC.light); ell(g, 6.5, 10, 10, 8); fillP(g, MC.light); ell(g, 0, 16, 7.5, 5.5); fillP(g, MC.light);
  ell(g, -19, 9, 6, 3.8); fillP(g, 'rgba(255,130,150,.38)'); ell(g, 19, 9, 6, 3.8); fillP(g, 'rgba(255,130,150,.38)');
  for (const sd of [-1, 1]) {
    const ex = sd * 12, ey = -3;
    if (eyes === 'closed' || eyes === 'sleep') { g.beginPath(); g.arc(ex, ey - 1, 6.5, .15 * Math.PI, .85 * Math.PI); strokeP(g, OUT, 3); }
    else if (eyes === 'happy') { g.beginPath(); g.arc(ex, ey + 3, 6.5, 1.15 * Math.PI, 1.85 * Math.PI); strokeP(g, OUT, 3.2); }
    else if (eyes === 'heart') { drawHeart(g, ex, ey + 2, 1.15, '#ff4d6d'); }
    else {
      const wide = eyes === 'wide', rx = wide ? 9.6 : 8.6, ry = wide ? 10.6 : 9.8;
      ell(g, ex, ey, rx + 1.6, ry + 1.6); fillP(g, OUT);
      const ig = g.createLinearGradient(0, ey - ry, 0, ey + ry); ig.addColorStop(0, MC.eyeD); ig.addColorStop(.55, MC.eye); ig.addColorStop(1, '#f1f59a');
      ell(g, ex, ey, rx, ry); g.fillStyle = ig; g.fill();
      ell(g, ex + lx * 2.6, ey + ly * 2.6, wide ? 5.4 : 3.2, wide ? 7.8 : 7.4); fillP(g, '#1a1410');
      circ(g, ex - 2.6 + lx, ey - 4, 2.9); fillP(g, '#fff'); circ(g, ex + 3 + lx, ey + 4, 1.4); fillP(g, 'rgba(255,255,255,.85)');
      if (eyes === 'half') { g.save(); ell(g, ex, ey, rx + 1.8, ry + 1.8); g.clip(); g.fillStyle = MC.fur; g.fillRect(ex - 13, ey - 15, 26, 14); line(g, ex - 10, ey - 1, ex + 10, ey - 1, OUT, 2.8); g.restore(); }
    }
  }
  g.beginPath(); g.moveTo(-4.5, 4.5); g.lineTo(4.5, 4.5); g.lineTo(0, 10); g.closePath(); ink(g, out === 'antlers' ? '#ff3a2e' : MC.nose, 1.6);

  const m = o.mouth || 'smile';
  if (m === 'open' || m === 'meow') { ell(g, 0, 15.5, 5, m === 'meow' ? 6.5 : 5); ink(g, '#7a2f35', 1.8); ell(g, 0, 18.5, 3.2, 2.2); fillP(g, '#ff8f9a'); }
  else { g.beginPath(); g.moveTo(-6.5, 12); g.quadraticCurveTo(-3, 15, 0, 11); g.quadraticCurveTo(3, 15, 6.5, 12); strokeP(g, OUT, 2); }
  g.globalAlpha = .85;
  for (const sd of [-1, 1]) for (let i = -1; i <= 1; i++) line(g, sd * 14, 11 + i * 3, sd * 38, 7 + i * 6, '#ffffff', 1.4);
  g.globalAlpha = 1;
  if (out === 'santa') {
    g.save(); g.rotate(.22);
    g.beginPath(); g.moveTo(-23, -20); g.quadraticCurveTo(-4, -64, 31, -56); g.quadraticCurveTo(14, -40, 23, -20); g.closePath(); ink(g, rad(g, 0, -40, 30, '#e8372e'));
    ell(g, 0, -20, 26, 7.5); ink(g, '#fffaf2'); circ(g, 32, -55, 8); ink(g, '#fffaf2');
    g.restore();
  } else if (out === 'antlers') {
    for (const sd of [-1, 1]) {
      for (const [w, c] of [[8, OUT], [4.5, '#b07a45']]) {
        g.beginPath(); g.moveTo(sd * 11, -20); g.quadraticCurveTo(sd * 16, -44, sd * 30, -58); strokeP(g, c, w + 1);
        g.beginPath(); g.moveTo(sd * 15, -36); g.lineTo(sd * 4, -48); strokeP(g, c, w);
        g.beginPath(); g.moveTo(sd * 22, -47); g.lineTo(sd * 34, -45); strokeP(g, c, w);

}

function monaTail(g, pts, t, wag) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';

  g.beginPath(); g.moveTo(pts[0], pts[1]); g.bezierCurveTo(pts[2], pts[3], pts[4] + w, pts[5], pts[6] + w * 1.4, pts[7]);

function monaLeg(g, x1, y1, x2, y2, far) {
  capO(g, x1, y1, x2, y2, 14, far ? MC.furD : MC.fur, 2.6);

function drawMona(g, x, y, s, o) {

  if (!o.noShadow) { ell(g, 0, 0, upright ? 42 : 58, 8); fillP(g, 'rgba(60,30,20,.22)'); }
  const hp = Object.assign({}, o, { t });
  if (pose === 'walk' || pose === 'stand' || pose === 'run' || pose === 'rub') {
    const run = pose === 'run', sp = run ? 16 : 10, amp = pose === 'stand' ? 0 : (run ? 13 : 8);
    const ph = o.gait != null && pose !== 'rub' ? o.gait : t * sp; // stride follows distance travelled, so no hitches
    const bob = pose === 'stand' ? 0 : Math.abs(Math.sin(ph)) * (run ? 5 : 2.5);

    const sw = i => Math.sin(ph + i) * amp;
    monaLeg(g, -26, -36, -26 + sw(Math.PI), -3 + bob, true); monaLeg(g, 30, -36, 30 + sw(0), -3 + bob, true);
    ell(g, 0, -40, 51, 25); ink(g, rad(g, 0, -40, 51, MC.fur));
    g.save(); ell(g, 0, -40, 49, 23); g.clip();

    monaStripes(g, -12, -43);
    for (const sx of [14, 26, -34, -42]) line(g, sx, -66, sx - 4, -50, MC.stripe, 5);
    g.restore();

    ell(g, 37, -53, 17, 19); ink(g, rad(g, 37, -53, 18, MC.fur)); ell(g, 43, -46, 9, 12); fillP(g, MC.light);

    ell(g, -12, -30, 32, 31); ink(g, rad(g, -12, -30, 32, MC.fur));
    g.save(); ell(g, -12, -30, 30, 29); g.clip(); monaStripes(g, -14, -32); line(g, -30, -58, -36, -42, MC.stripe, 5); g.restore();
    const lift = pose === 'beg' ? -10 : 0;
    ell(g, 8, -54 + lift, 26, 39, -.22); ink(g, rad(g, 8, -54 + lift, 30, MC.fur));
    ell(g, 18, -52 + lift, 13, 25, -.2); fillP(g, MC.light);
    if (pose === 'celebrate' || pose === 'beg') {
      const b = Math.sin(t * 9) * 3;

    } else if (pose === 'swat') {
      const k = o.swatK != null ? o.swatK : (Math.sin(t * 6) * .5 + .5);
      monaLeg(g, 14, -40, 14, -4, true);

/* decade backdrops for the style cards: '80s laser grid + neon, '90s squiggles and confetti, '60s mod circles */
function styleBackdrop(pat, x, y, w, h, seed) {
  const r = mulberry(seed * 7 + 3); ctx.save();
  if (pat === '80s') {
    ctx.globalAlpha = .35; ctx.strokeStyle = '#ff4fa8'; ctx.lineWidth = 2;
    const hy = y + h * .72; for (let k = -10; k <= 10; k++) { ctx.beginPath(); ctx.moveTo(x + w / 2 + k * 14, hy); ctx.lineTo(x + w / 2 + k * 70, y + h); ctx.stroke(); }
    for (let k = 0; k < 6; k++) { const yy = hy + Math.pow(k / 6, 1.6) * (h * .28); ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); }
    ctx.globalAlpha = .5; for (let k = 0; k < 7; k++) { const xx = x + r() * w, yy = y + r() * h * .6; ctx.beginPath(); ctx.moveTo(xx, yy - 8); ctx.lineTo(xx + 8, yy + 6); ctx.lineTo(xx - 8, yy + 6); ctx.closePath(); ctx.strokeStyle = k % 2 ? '#33c7e6' : '#ffd34d'; ctx.lineWidth = 3; ctx.stroke(); }
  } else if (pat === '90s') {
    ctx.globalAlpha = .45; ctx.lineCap = 'round';
    for (let k = 0; k < 9; k++) { const xx = x + r() * w, yy = y + r() * h, c = ['#ff7eb6', '#2fb5a6', '#7a5cff', '#ff9a3a'][k % 4]; if (k % 3 === 0) { ctx.beginPath(); for (let j = 0; j < 5; j++) ctx.lineTo(xx + j * 9, yy + (j % 2 ? -7 : 7)); ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.stroke(); } else if (k % 3 === 1) { circ(ctx, xx, yy, 6); fillP(ctx, c); } else { rr(ctx, xx, yy, 14, 14, 2); ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke(); } }
  } else {
    ctx.globalAlpha = .25; for (let k = 0; k < 4; k++) { circ(ctx, x + w * (.2 + k * .22), y + h * (.25 + (k % 2) * .35), 26 + k * 6); ctx.strokeStyle = k % 2 ? '#2f6f6a' : '#d94f8c'; ctx.lineWidth = 7; ctx.stroke(); }
  }
  ctx.restore();
}

/* a pink foam hair roller, seen end-on as it tumbles */
function drawRoller(g, x, y, r, rot) {
  g.save(); g.translate(x, y); g.rotate(rot || 0);
  circ(g, 0, 0, r); const rg = g.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); rg.addColorStop(0, '#ffd1e6'); rg.addColorStop(1, '#ff5aa8'); g.fillStyle = rg; g.fill(); g.strokeStyle = OUT; g.lineWidth = 2; g.stroke();

  g.restore();
}

/* =================== SALON INVADERS (space-invaders style) ===================
   Marching shampoo bottles, combs and scissors creep down on the salon.
   Mona defends from behind laundry-hamper barriers by firing soap bubbles. */
const IV = { W: 360, H: 480, PY: 446, HAMPER_Y: 372 };
const INV_ROWS = ['scissors', 'comb', 'comb', 'bottle', 'bottle'];
const INV_PTS = { scissors: 30, comb: 20, bottle: 10 };
const INV_COLS = 8;
function ivHamper(cx) {
  // a tub of hair gel made of little cells that crumble when hit: screw lid on top, rounded jar below
  const cols = 14, rows = 10, cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let on;
    if (r === 0) on = c >= 1 && c < cols - 1;                 // lid top, rounded corners
    else if (r <= 2) on = true;                              // lid rim
    else if (r === 3) on = c >= 1 && c < cols - 1;           // the neck under the lid
    else if (r < rows - 1) on = c >= 1 && c < cols - 1;      // jar body
    else on = c >= 2 && c < cols - 2;                        // rounded base
    cells.push(on ? 1 : 0);
  }
  return { cx, x: cx - cols * 1.75, y: IV.HAMPER_Y - 2, cols, rows, cells, cs: 3.5 };
}
SCENES.inv = {
  pausable: true,
  enter(p) { this.lastParams = p; playTrack('arcade'); this.st = { params: p, ph: 'ready', score: 0, lives: 3, wave: 1, px: IV.W / 2, shots: [], drops: [], pops: [], cool: 0, inv: 0, ufo: null, ufoT: rand(12, 16), banner: 1.4 }; this.newWave(); },
  newWave() {
    const st = this.st; st.fleet = []; st.dir = 1; st.stepT = 0; st.frame = 0; st.shots = []; st.drops = [];
    const top = 54 + Math.min(2, st.wave - 1) * 14;
    INV_ROWS.forEach((kind, r) => { for (let c = 0; c < INV_COLS; c++) st.fleet.push({ kind, x: 52 + c * 36, y: top + r * 30, alive: true, hue: (c + r) % 3 }); });
    st.total = st.fleet.length; st.hampers = [60, 140, 220, 300].map(ivHamper); st.banner = 1.4;
  },
  view() { const GA = arcadeGA(), sc = Math.min(GA.w / IV.W, GA.h / IV.H); return { GA, sc, ox: GA.x + (GA.w - IV.W * sc) / 2, oy: GA.y + (GA.h - IV.H * sc) / 2 }; },
  wx(x) { const v = this.view(); return (x - v.ox) / v.sc; },
  start() { if (this.st.ph === 'ready') { this.st.ph = 'play'; sfx('power'); return true; } return false; },
  holdTap() { this.start(); },
  // touch: Mona slides to your finger and keeps firing while you hold; mouse/trackpad: she follows the pointer, click to fire
  down(x, y, id) { const st = this.st, started = this.start(); st.touch = { id, x: this.wx(x) }; if (!started) this.fire(); },
  move(x, y, px, py, id) { const st = this.st; if (st.touch && st.touch.id === id) st.touch.x = this.wx(x); },
  up(x, y, s, id) { const st = this.st; if (st.touch && st.touch.id === id) st.touch = null; },
  hover(x) { this.st.hoverX = this.wx(x); },
  hoverEnd() { this.st.hoverX = null; },
  wheelRaw(dx) { const st = this.st; if (st.ph !== 'play') return; st.px = clamp(st.px + dx * .6, 18, IV.W - 18); st.hoverX = null; },
  wheel() { this.start(); },
  key(k) { if (this.start()) return; if (k === 'a' || k === 'up') this.fire(); },

  scr(x, y) { const v = this.view(); return [v.ox + x * v.sc, v.oy + y * v.sc]; },
  hitHamper(x, y, rad) {

    let sx = 0, sy = 0; for (const id of hit) { const r = Math.floor(id / SS.N), c = id % SS.N; st.g[r][c].pop = .001; sx += c; sy += r; }

    st.pops.push({ c: sx, r: sy, txt: '+' + pts, t: 0, big: false });
    if (st.combo >= 2) st.pops = st.pops.filter(q => !(q.big && /COMBO|SUDS|BUBBLE/.test(q.txt)));
    if (st.combo >= 2) st.pops.push({ c: sx, r: sy - .8, txt: ['', '', 'COMBO ×2!', 'COMBO ×3!', 'SUDS-TASTIC ×4!', 'BUBBLE BLOWOUT ×5!'][Math.min(5, st.combo)] || 'COMBO ×' + st.combo + '!', t: 0, big: true });
    if (runs.some(n => n >= 5)) st.pops.push({ c: sx, r: sy + .8, txt: 'FIVE IN A ROW!', t: 0, big: true });
    const v = this.view(); for (const id of hit) { const r = Math.floor(id / SS.N), c = id % SS.N; const p = this.cellXY(v, r, c); for (let i = 0; i < 3; i++) spawn('sparkle', p[0], p[1]); }
    st.anim = { type: 'pop', t: 0 };
  },
  collapse() {

  },
  // ---- input: tap one bottle then a neighbour, or swipe a bottle toward its neighbour ----
  view() { const GA = arcadeGA(), hud = 46, cs = Math.floor(Math.min((GA.w - 20) / SS.N, (GA.h - hud - 16) / SS.N)), bw = cs * SS.N; return { GA, cs, ox: GA.x + (GA.w - bw) / 2, oy: GA.y + hud + (GA.h - hud - bw) / 2, bw }; },
  cellXY(v, r, c) { return [v.ox + (c + .5) * v.cs, v.oy + (r + .5) * v.cs]; },
  cellAt(x, y) { const v = this.view(), c = Math.floor((x - v.ox) / v.cs), r = Math.floor((y - v.oy) / v.cs); return r >= 0 && r < SS.N && c >= 0 && c < SS.N ? [r, c] : null; },
  start() { if (this.st.ph === 'ready') { this.st.ph = 'play'; sfx('power'); return true; } return false; },
  holdTap() { this.start(); },
  down(x, y) {
    if (this.start()) return; const st = this.st, cell = this.cellAt(x, y); if (!cell || st.anim) return;
    st.drag = { cell, x, y, done: false };
    if (st.sel && Math.abs(st.sel[0] - cell[0]) + Math.abs(st.sel[1] - cell[1]) === 1) { this.trySwap(st.sel, cell); st.drag.done = true; return; }
    st.sel = st.sel && st.sel[0] === cell[0] && st.sel[1] === cell[1] ? null : cell; sfx('click');
  },
  move(x, y) {
    const st = this.st, d = st.drag; if (!d || d.done) return; const v = this.view(), dx = x - d.x, dy = y - d.y;
    if (Math.hypot(dx, dy) > v.cs * .4) { d.done = true; const to = Math.abs(dx) > Math.abs(dy) ? [d.cell[0], d.cell[1] + Math.sign(dx)] : [d.cell[0] + Math.sign(dy), d.cell[1]]; if (to[0] >= 0 && to[0] < SS.N && to[1] >= 0 && to[1] < SS.N) this.trySwap(d.cell, to); }
  },
  up() { this.st.drag = null; },
  hover(x, y) { const c = this.cellAt(x, y); if (c) this.st.cur = c; },
  key(k) {
    if (this.start()) return; const st = this.st, m = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[k];

  },
  // ---- game loop ----
  update(dt) {

    for (const p of st.pops) p.t += dt; st.pops = st.pops.filter(p => p.t < (p.big ? 1.3 : .9));
    st.banner = Math.max(0, st.banner - dt); st.hint += st.ph === 'play' && !st.anim ? dt : 0;
    const an = st.anim;
    if (an && an.type === 'fall') {

      for (let r = 0; r < SS.N; r++) for (let c = 0; c < SS.N; c++) { const tl = st.g[r][c]; if (tl.y < r) { tl.vy += 38 * dt; tl.y = Math.min(r, tl.y + tl.vy * dt); if (tl.y >= r) { tl.y = r; tl.vy = 0; tl.land = .2; } moving = true; } if (tl.land) tl.land = Math.max(0, tl.land - dt); }

    } else if (an && an.type === 'swap') { an.t += dt / .16; if (an.t >= 1) this.afterSwap(); }
    else if (an && an.type === 'pop') { an.t += dt / .24; for (const row of st.g) for (const tl of row) if (tl.pop) tl.pop = Math.min(1, an.t); if (an.t >= 1) this.collapse(); }
    for (const row of st.g) for (const tl of row) if (tl.land) tl.land = Math.max(0, tl.land - dt);
  },
  settle() {
    const st = this.st; if (st.ph !== 'play') return;
    if (st.score >= SS.TARGET) { st.score += st.moves * 100; st.ph = 'win'; st.endT = 0; finishArcade('swap', st.score); sfx('win'); for (let i = 0; i < 40; i++) spawn('confetti', W / 2, H * .3); return; }
    if (st.moves <= 0) { st.ph = 'over'; st.endT = 0; finishArcade('swap', st.score); sfx('fail'); return; }
    if (!this.hasMove()) { st.pops.push({ c: 3.5, r: 3.5, txt: 'RESHUFFLE!', t: 0, big: true }); this.fill(); }
  },
  draw() {
    const st = this.st, v = this.view(), GA = v.GA;
    arcadeShell('SHAMPOO SWAP', '#3cc6b4', () => go('arcade', { next: st.params && st.params.next }), st);
    arcadeScreen(GA, () => {
      const bg = ctx.createLinearGradient(0, GA.y, 0, GA.y + GA.h); bg.addColorStop(0, '#2a1d2e'); bg.addColorStop(1, '#3d2540'); ctx.fillStyle = bg; ctx.fillRect(GA.x, GA.y, GA.w, GA.h);
      snowfall(GA.x, GA.y, GA.w, GA.h, 24, 13);
      // HUD: score toward the target, moves left
      const bw = Math.min(GA.w - 150, 260), bx = GA.x + GA.w / 2 - bw / 2;
      meterBar(bx, GA.y + 14, bw, 18, st.score / SS.TARGET, '#ff6fae', Math.round(st.score) + ' / ' + SS.TARGET);
      text(ctx, 'MOVES', GA.x + 16, GA.y + 16, { size: 8, font: PIXEL, weight: 400, color: 'rgba(255,255,255,.6)', align: 'left' });
      text(ctx, String(st.moves), GA.x + 16, GA.y + 34, { size: 16, font: PIXEL, weight: 400, color: st.moves <= 5 ? '#ff7a7a' : '#ffd34d', align: 'left' });
      // salon shelf behind the bottles
      rr(ctx, v.ox - 8, v.oy - 8, v.bw + 16, v.bw + 16, 14); fillP(ctx, 'rgba(255,255,255,.06)');
      for (let r = 0; r < SS.N; r++) for (let c = 0; c < SS.N; c++) { rr(ctx, v.ox + c * v.cs + 2, v.oy + r * v.cs + 2, v.cs - 4, v.cs - 4, 8); fillP(ctx, (r + c) % 2 ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.09)'); }
      // selection + keyboard cursor
      if (st.sel) { rr(ctx, v.ox + st.sel[1] * v.cs + 1, v.oy + st.sel[0] * v.cs + 1, v.cs - 2, v.cs - 2, 9); ctx.lineWidth = 3; ctx.strokeStyle = '#ffd34d'; ctx.stroke(); }
      if (FINE_POINTER && st.ph === 'play') { rr(ctx, v.ox + st.cur[1] * v.cs + 3, v.oy + st.cur[0] * v.cs + 3, v.cs - 6, v.cs - 6, 8); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke(); }
      // after a few idle seconds, nudge a possible move
      let hint = null; if (st.hint > 6 && !st.anim) hint = this.hasMove();
      // bottles
      ctx.save(); rr(ctx, v.ox - 8, v.oy - 8, v.bw + 16, v.bw + 16, 14); ctx.clip();
      const an = st.anim;
      for (let r = 0; r < SS.N; r++) for (let c = 0; c < SS.N; c++) {
        const tl = st.g[r][c]; let rr2 = tl.y, cc = c;
        if (an && an.type === 'swap') { const e = E.inOut(an.t), A = an.a, B = an.b; if (r === A[0] && c === A[1]) { rr2 = lerp(A[0], B[0], e); cc = lerp(A[1], B[1], e); } else if (r === B[0] && c === B[1]) { rr2 = lerp(B[0], A[0], e); cc = lerp(B[1], A[1], e); } }
        const x = v.ox + (cc + .5) * v.cs, y = v.oy + (rr2 + .5) * v.cs;
        let s = v.cs / 46; if (tl.pop) s *= 1 + tl.pop * .4; const alpha = tl.pop ? 1 - tl.pop : 1;
        const sel = st.sel && st.sel[0] === r && st.sel[1] === c, hinted = hint && ((hint[0][0] === r && hint[0][1] === c) || (hint[1][0] === r && hint[1][1] === c));
        const bob = sel ? Math.sin(TT * 10) * 2 : hinted ? Math.sin(TT * 8) * 2.5 : 0, sq = tl.land ? 1 - tl.land * .6 : 0;
        ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y + bob); ctx.scale(s * (1 + sq * .15), s * (1 - sq * .15)); drawSwapBottle(ctx, tl.k, TT, sel); ctx.restore();
      }
      ctx.restore();
      // pop-ups
      for (const p of st.pops) { const [x, y] = this.cellXY(v, p.r, p.c), j = jiggle(p.t, p.c), k = E.back(clamp(p.t * 5, 0, 1)); ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (p.t - (p.big ? .9 : .55)) / .35); ctx.translate(clamp(x, GA.x + 90, GA.x + GA.w - 90), y - p.t * 34); ctx.scale(k * j.sx, k * j.sy); ctx.rotate(j.rot); text(ctx, p.txt, 0, 0, { size: p.big ? 15 : 12, font: PIXEL, weight: 400, color: p.big ? '#ffd34d' : '#fff', stroke: '#2a1d2e', sw: 6 }); ctx.restore(); }
      if (st.ph === 'ready') readyOverlay(GA, 'SHAMPOO SWAP', ['Swap bottles to make rows of 3.', 'Chain combos for big points!']);
    });
    controls('swap');
    if (st.ph === 'over') arcadeEnd(st, 'swap', false, ['Out of moves!', 'Score: ' + st.score]);
    if (st.ph === 'win') arcadeEnd(st, 'swap', true, ['Shelf sparkling!', 'Score: ' + st.score]);
  }
};
/* six salon products, each with its own colour AND shape so they're easy to tell apart */
function drawSwapBottle(g, k, t, sel) {
  const c = SS_COLS[k], hi = mixToHex(c, '#ffffff', .45), dk = shade(c, -.35);
  const body = (path) => { g.beginPath(); path(); const gr = g.createLinearGradient(-14, 0, 14, 0); gr.addColorStop(0, dk); gr.addColorStop(.4, hi); gr.addColorStop(1, c); g.fillStyle = gr; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(30,12,24,.75)'; g.stroke(); };
  g.lineJoin = 'round';
  if (k === 0) { // pump bottle
    body(() => { g.moveTo(-12, -6); g.quadraticCurveTo(-13, 16, -10, 18); g.lineTo(10, 18); g.quadraticCurveTo(13, 16, 12, -6); g.quadraticCurveTo(0, -11, -12, -6); });
    rr(g, -4, -16, 8, 9, 2); ink(g, '#fff4e8', 1.6); rr(g, -2, -21, 12, 4, 2); ink(g, '#fff4e8', 1.6);
  } else if (k === 1) { // round jar of hair mask
    body(() => { g.ellipse(0, 4, 15, 13, 0, 0, TAU); });
    rr(g, -13, -13, 26, 8, 3); ink(g, '#fff4e8', 1.6);
  } else if (k === 2) { // tall spray can
    body(() => { rr(g, -9, -12, 18, 30, 5); });
    rr(g, -6, -18, 12, 7, 3); ink(g, '#e8e8ee', 1.6); rr(g, -2, -22, 4, 5, 1); fillP(g, '#3a363f');
  } else if (k === 3) { // squeeze tube, upside down on its cap
    body(() => { g.moveTo(-12, -16); g.lineTo(12, -16); g.lineTo(8, 12); g.lineTo(-8, 12); g.closePath(); });
    rr(g, -6, 12, 12, 7, 2); ink(g, '#fff4e8', 1.6); for (let i = -9; i <= 9; i += 3) line(g, i, -16, i, -13, 'rgba(30,12,24,.4)', 1);
  } else if (k === 4) { // serum dropper
    body(() => { g.moveTo(-9, -4); g.lineTo(-9, 16); g.quadraticCurveTo(0, 21, 9, 16); g.lineTo(9, -4); g.closePath(); });
    rr(g, -5, -10, 10, 7, 2); fillP(g, '#2a2228'); ell(g, 0, -15, 5, 6); ink(g, '#2a2228', 1);
  } else { // conditioner with a flip cap
    body(() => { g.moveTo(-11, -10); g.lineTo(11, -10); g.quadraticCurveTo(14, 4, 10, 18); g.lineTo(-10, 18); g.quadraticCurveTo(-14, 4, -11, -10); });
    rr(g, -9, -17, 18, 8, 4); ink(g, '#fff4e8', 1.6);
  }

  rr(g, -7, -1, 14, 11, 3); fillP(g, 'rgba(255,255,255,.88)');
  const sx = 0, sy = 4.5; g.fillStyle = c;
  if (k === 0) drawHeart(g, sx, sy - 1, .45, c); else if (k === 1) { circ(g, sx, sy, 3); fillP(g, c); } else if (k === 2) drawStar(g, sx, sy, 3.6, c, 5); else if (k === 3) { g.beginPath(); g.moveTo(sx, sy - 3.5); g.quadraticCurveTo(sx + 3.5, sy + 1, sx, sy + 3); g.quadraticCurveTo(sx - 3.5, sy + 1, sx, sy - 3.5); fillP(g, c); } else if (k === 4) { g.beginPath(); g.moveTo(sx - 3, sy + 3); g.quadraticCurveTo(sx - 3, sy - 3, sx + 3, sy - 3); g.quadraticCurveTo(sx + 3, sy + 3, sx - 3, sy + 3); fillP(g, c); } else drawStar(g, sx, sy, 3.6, c, 4);
  ell(g, -6, -2, 2, 6, .2); fillP(g, 'rgba(255,255,255,.45)');
  if (sel) { g.globalAlpha = .5 + .5 * Math.sin(t * 8); drawStar(g, 12, -14, 4, '#fff', 4); g.globalAlpha = 1; }
}
GAMES.push({ id: 'swap', name: 'Shampoo Swap', sub: 'Match three bottles, chain combos', col: '#3cc6b4' });
ARC_PREVIEW.swap = function (x, y, w, h) {
  ctx.fillStyle = '#2a1d2e'; ctx.fillRect(x, y, w, h);
  const cs = Math.min(w / 6, h / 4), ox = x + (w - cs * 6) / 2, oy = y + (h - cs * 4) / 2;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { const k = (r * 7 + c * 3 + (r === 1 && c > 1 && c < 5 ? 0 : 1)) % 6, kk = r === 1 && c > 1 && c < 5 ? 3 : k; ctx.save(); ctx.translate(ox + (c + .5) * cs, oy + (r + .5) * cs + (r === 1 && c > 1 && c < 5 ? Math.sin(TT * 6) * 2 : 0)); ctx.scale(cs / 50, cs / 50); drawSwapBottle(ctx, kk, TT, false); ctx.restore(); }
};

/* removed from the arcade: Super Scrunchie and Claw Clip Chomp */
for (const id of ['plat', 'pac']) { const i = GAMES.findIndex(g => g.id === id); if (i >= 0) GAMES.splice(i, 1); }

/* =================== Boot =================== */
resize();
(function () {
  const h = (location.hash || '').slice(1);
  setScene(SCENES[h] ? h : 'title');
  requestAnimationFrame(t => { lastT = t; frame(t); });
})();
